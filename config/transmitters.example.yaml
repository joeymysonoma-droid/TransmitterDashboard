# ASMG TX Dashboard - transmitter list
# Nautel VS/VX: set host + snmp_community (SNMP UDP 161).
# GatesAir Flexiva: set host (+ optional http_username/password); polls HTTP /json.
# AAT FM: SNMP enterprise 51550 (optional http_username/password for GUI).
# Crown/Ecreso (Audemat FmNgIp): http_username/password for /wscom (default Admin/admin).

poll_interval_seconds: 30
history_retention_days: 90
history_min_interval_seconds: 60
http_host: "0.0.0.0"
http_port: 8090
snmp_timeout_seconds: 5
snmp_retries: 2

# Alerts: dashboard banner is always on. Email is optional.
# Per-TX overrides go under each transmitter's `alerts:` block.
alerts:
  email_enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_tls: true
  email_from: ""
  email_to: []                 # e.g. ["you@sonoma.com"]
  cooldown_minutes: 30
  unreachable_polls: 3         # polls before offline alert
  on_unreachable: true
  on_rf_off: true
  on_tx_alarms: true
  vswr: 1.5                    # set null to disable
  reflected_w: null
  heatsink_c: 70.0
  forward_min_w: null          # prefer per-TX values below
  skip_unconfigured: true      # ignore blank VX hosts

transmitters:
  - id: vs300-1
    name: "KZST Exciter"
    model: vs300
    host: "10.2.10.52"
    snmp_community: public
    snmp_port: 161
    location: "Mt. Taylor"
    alerts:
      forward_min_w: 12         # ~24 W normal
      reflected_w: 2.0
      vswr: 1.5
      heatsink_c: 65.0

  - id: vs300-2
    name: "KJZY Exciter"
