<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASMG TX Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css?v=8">
</head>
<body data-page="fleet">
  <div class="container">
    <header>
      <div>
        <h1>ASMG TX Dashboard</h1>
        <p class="sub">Nautel · AAT · GatesAir · Crown fleet status</p>
      </div>
      <div class="actions">
        <span id="updated" class="sub"></span>
        <a class="btn" href="/wall">Wall view</a>
        <a class="btn" href="/settings">Settings</a>
        <a class="btn" href="/api/history.csv?range=24h">Export fleet CSV</a>
        <button id="refresh-btn" class="primary" type="button">Poll now</button>
      </div>
    </header>

    <section id="alert-banner" class="alert-banner" aria-live="polite">
      <div class="alert-banner-top">
        <h2>Active alerts</h2>
        <div class="alert-banner-actions">
          <button id="test-email-btn" type="button" title="Send a test email">Test email</button>
        </div>
      </div>
      <ul id="alert-list"></ul>
      <details class="alert-history">
        <summary>Recent alert events</summary>
        <ul id="alert-events"></ul>
      </details>
    </section>

    <section id="summary" class="summary" aria-label="Fleet summary"></section>
    <section id="fleet" class="grid" aria-label="Transmitters"></section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite">
    <div class="title" id="toast-title"></div>
    <div class="body" id="toast-body"></div>
  </div>
  <script src="/static/app.js?v=8"></script>
</body>
</html>
