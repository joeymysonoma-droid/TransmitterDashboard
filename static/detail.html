<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmitter Detail — ASMG TX Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css?v=13">
</head>
<body data-page="detail">
  <div class="container">
    <header>
      <div>
        <div class="breadcrumb"><a href="/">← Fleet</a></div>
        <h1 id="tx-name">Transmitter</h1>
        <p class="sub" id="tx-meta"></p>
      </div>
      <div class="actions">
        <span id="tx-status"></span>
        <a id="aui-link" class="btn" href="#" target="_blank" rel="noopener" hidden>Open AUI</a>
        <a id="csv-link" class="btn" href="#">Export CSV</a>
        <button id="refresh-btn" class="primary" type="button">Poll now</button>
      </div>
    </header>

    <section id="rf-controls" class="panel rf-controls" hidden>
      <h2>RF control</h2>
      <p class="sub" id="rf-controls-note">Controls are gated. Confirm carefully — this affects on-air RF.</p>
      <div class="actions">
        <button id="rf-on-btn" type="button" class="primary" disabled>RF On</button>
        <button id="rf-off-btn" type="button" class="danger" disabled>RF Off</button>
      </div>
      <p id="rf-controls-status" class="sub"></p>
    </section>

    <p id="tx-error" class="error-text" hidden></p>

    <div class="detail-layout">
      <section class="panel">
        <h2>Live meters</h2>
        <div id="meters" class="meter-groups"></div>
      </section>

      <section class="panel">
        <h2>Alarms</h2>
        <ul id="alarms" class="alarms"></ul>
      </section>

      <section class="panel">
        <h2>History</h2>
        <div class="range-tabs">
          <button type="button" data-range="1h">1h</button>
          <button type="button" class="active" data-range="24h">24h</button>
          <button type="button" data-range="7d">7d</button>
          <button type="button" data-range="30d">30d</button>
        </div>

        <div id="chart-grid" class="chart-grid"></div>
      </section>
    </div>
  </div>
  <script src="/static/app.js?v=13"></script>
</body>
</html>
